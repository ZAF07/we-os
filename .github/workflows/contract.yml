name: contract

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - ".github/workflows/contract.yml"
  pull_request:
    paths:
      - "contracts/**"
      - ".github/workflows/contract.yml"

jobs:
  lint-and-mock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint the OpenAPI contract
        run: npm run lint
      - name: Happy path against the mock server
        run: npm test
