# Local Postgres for development and integration testing. Test-only: the data
# directory is a tmpfs, so everything is gone the moment the container stops.
# Never point this at anything you want to keep.
services:
  postgres:
    image: postgres:16-alpine
    container_name: we-os-postgres
    environment:
      POSTGRES_USER: marketing_os
      POSTGRES_PASSWORD: marketing_os
      POSTGRES_DB: marketing_os
    ports:
      # 5435: this machine already runs other Postgres containers on 5431/5433/5434.
      - "5435:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./scripts/create-app-role.sql:/docker-entrypoint-initdb.d/10-create-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketing_os -d marketing_os"]
      interval: 1s
      timeout: 3s
      retries: 30
