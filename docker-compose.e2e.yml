# The end-to-end test stack: Postgres, the engine, and the web app together.
#
# One command brings up everything the browser suite needs and seeds two test
# tenants: one whose Brand DNA is fixed, so a spec asserts on a *named* Audience
# Segment rather than whatever the first radio happens to be, and one with no
# Brand DNA at all, so the onboarding specs can exercise the wizard's gating.
# Run it with `make test-e2e` from the repository root.
#
# The seed *establishes* fixture state rather than adding to it: it purges both
# tenants' campaigns and re-blanks the blank tenant, so a suite run against a
# freshly started stack always sees the same fixture however many runs came
# before it.
#
# Test-only. Postgres keeps its data in a tmpfs, so the stack starts clean every
# time and leaves nothing behind. Never point this at anything you want to keep.
#
# Credentials come from web/.env.local, which is gitignored — see
# web/.env.local.example for what it must contain and where to get it.
name: we-os-e2e

# Shared by both web services below. Extension fields: Compose ignores keys
# starting with `x-`, and the YAML anchors let each service merge them in.
x-web-service: &web-service
  depends_on:
    engine:
      condition: service_healthy
  ports:
    - "3100:3000"
  healthcheck:
    test:
      [
        "CMD-SHELL",
        "node -e \"fetch('http://localhost:3000/sign-in').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
      ]
    interval: 2s
    timeout: 5s
    retries: 45

x-web-environment: &web-environment
  ENGINE_BASE_URL: http://engine:8000
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?set it in web/.env.local}
  CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set it in web/.env.local}
  NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
  NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marketing_os
      POSTGRES_PASSWORD: marketing_os
      POSTGRES_DB: marketing_os
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./agent-harness/scripts/create-app-role.sql:/docker-entrypoint-initdb.d/10-create-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketing_os -d marketing_os"]
      interval: 1s
      timeout: 3s
      retries: 30

  # Creates the schema and establishes both test tenants' fixture state, then
  # exits. Everything that needs a database waits for this rather than for
  # Postgres alone, so nothing ever reads a half-built schema.
  seed:
    build:
      context: ./agent-harness
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMIN_DSN: postgresql://marketing_os:marketing_os@postgres:5432/marketing_os
      E2E_CLERK_ORG_ID: ${E2E_CLERK_ORG_ID:?set E2E_CLERK_ORG_ID in web/.env.local}
      E2E_CLERK_BLANK_ORG_ID: ${E2E_CLERK_BLANK_ORG_ID:?set E2E_CLERK_BLANK_ORG_ID in web/.env.local}
      # Recorded on the seeded tenant as the address it is reached at, so the
      # engine's first reminder tick has somewhere to send (ADR-0028).
      E2E_CLERK_USER_EMAIL: ${E2E_CLERK_USER_EMAIL:?set E2E_CLERK_USER_EMAIL in web/.env.local}
      MARKETING_OS_ROOT: /repo
    volumes:
      # `init-db` runs through the CLI, which resolves the repo root before it
      # does anything — so the seeder needs the same mount the engine has.
      - ./:/repo:ro
    command:
      - sh
      - -c
      - |
        marketing-os init-db --dsn "$$ADMIN_DSN" --app-role marketing_os_app &&
        python scripts/seed_test_tenants.py --dsn "$$ADMIN_DSN" --organization-id "$$E2E_CLERK_ORG_ID" --blank-organization-id "$$E2E_CLERK_BLANK_ORG_ID" --user-email "$$E2E_CLERK_USER_EMAIL"

  engine:
    build:
      context: ./agent-harness
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      MARKETING_OS_POSTGRES_DSN: postgresql://marketing_os_app:marketing_os_app@postgres:5432/marketing_os
      MARKETING_OS_AUTH_ISSUER: ${MARKETING_OS_AUTH_ISSUER:?set MARKETING_OS_AUTH_ISSUER in web/.env.local}
      MARKETING_OS_ROOT: /repo
      # The suite drives the interface, not the models: a run must reach an
      # Approval Gate deterministically, instantly and for free, so the engine
      # runs on the scripted provider rather than calling anyone. Both settings
      # are required — selecting the provider alone is refused, because a
      # provider that fabricates deliverables must never be reachable by
      # accident.
      MARKETING_OS_PROVIDER: scripted
      MARKETING_OS_ALLOW_SCRIPTED_MODEL: "1"
      # The scripted performance-plan specialist asks the business a fixed
      # question instead of writing, so the suite can walk a Clarification
      # (ADR-0028). Two gates deep on purpose: every spec that runs to the
      # first or second gate is untouched by it.
      MARKETING_OS_SCRIPTED_ASK_STAGE: performance-plan
      # Short enough that a review the brand and clarification specs clear by
      # saving an answer is due again before the review spec gives up waiting,
      # and long enough that marking it reviewed holds while the spec walks
      # back to Home to see the item gone (ADR-0028).
      MARKETING_OS_DNA_REVIEW_INTERVAL: 20s
      # The reminder email goes through the no-op mailer, which logs and sends
      # nothing: this stack must never reach a real inbox. It is the engine's
      # default, named here so nobody has to check. The URL is where the
      # reminder's Brand page link points, which is this stack's web app.
      MARKETING_OS_MAILER: noop
      MARKETING_OS_APP_URL: http://localhost:3100
      MARKETING_OS_WEB: "0"
      MARKETING_OS_LOG_LEVEL: INFO
    volumes:
      # The engine reads code-shipped material — agent specs, guardrails,
      # templates — from the repo root at runtime (ADR-0003). Read-only, so a
      # run cannot edit the governance it is bound by.
      - ./:/repo:ro
      # Run traces are written under the same root, so they need a writable
      # layer of their own. Anonymous, so traces die with the stack rather than
      # accumulating in the working tree.
      - /repo/logs
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 2s
      timeout: 5s
      retries: 30

  # The web app, served two ways from one Dockerfile and this one file, so the
  # two cannot drift. Both bind 3100, so they are never started together: the
  # Makefile names one or the other.
  #
  #   - `web` is the fast loop's (`make e2e-up`): `next dev` over a bind mount
  #     of the working tree, so a frontend edit is tested with no rebuild.
  #   - `web-built` is the gate's (`make test-e2e`): a production build, with
  #     the source copied into the image. Every route is compiled before the
  #     first request and there is no dev cache to write, so no spec pays a
  #     compile inside an assertion — the two causes of rotating failures that
  #     the warm list in web/tests/auth.setup.ts and DEV_FILESYSTEM_CACHE below
  #     only work around for the dev server. A frontend edit reaches it only
  #     through a rebuild, which `make test-e2e` always does.
  #
  # What the two share is written once, as extension fields, and merged in.
  web:
    build:
      context: ./web
      target: dependencies
    <<: *web-service
    volumes:
      # The working tree, not the copy baked into the image — otherwise the
      # suite silently tests whatever the source looked like when the image was
      # last built, which is worse than not running at all.
      - ./web:/app
      # Keep the container's own installed dependencies and build cache: the
      # host's are built for a different platform.
      - /app/node_modules
      - /app/.next
    environment:
      <<: *web-environment
      # No persistent Turbopack cache: this container is thrown away with the
      # stack, and writing the cache mid-suite stalls the dev server (see
      # web/next.config.ts).
      DEV_FILESYSTEM_CACHE: "0"

  web-built:
    build:
      context: ./web
      target: production
      args:
        # Inlined into the client bundle at build time, so they must be known
        # here and not only at runtime. Same source as the runtime values.
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?set it in web/.env.local}
        NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
        NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
    <<: *web-service
    environment:
      <<: *web-environment
